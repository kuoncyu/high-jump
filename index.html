<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業跳高裁判系統 V13</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 基礎設定 */
        body { padding-bottom: 280px; background-color: #f4f6f8; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; touch-action: manipulation; }
        
        /* 狀態圖示 */
        .status-box { width: 30px; height: 30px; display: inline-block; text-align: center; line-height: 30px; border: 1px solid #ccc; margin-right: 2px; font-weight: bold; font-size: 15px; border-radius: 4px; }
        .status-O { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .status-X { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        .status-P { background-color: #fff3cd; color: #856404; border-color: #ffeeba; }
        .status-R { background-color: #e2e3e5; color: #383d41; border-color: #d6d8db; }
        
        /* 表格容器 */
        .table-container { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 100px;
            position: relative;
        }
        
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        
        th, td { 
            height: 60px; 
            vertical-align: middle; 
            text-align: center; 
            padding: 4px;
            border-bottom: 1px solid #dee2e6;
            border-right: 1px solid #dee2e6;
        }

        /* 中間成績格固定寬度 */
        th:not(.sticky-col-left):not(.sticky-col-right), 
        td:not(.sticky-col-left):not(.sticky-col-right) {
            min-width: 115px; 
            max-width: 115px;
            width: 115px;
        }
        
        /* --- 左側凍結 (背號) --- */
        .sticky-col-left { 
            position: sticky; 
            left: 0; 
            z-index: 30;
            border-right: 3px solid #dee2e6 !important; 
            min-width: 70px; max-width: 70px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            background-clip: padding-box; /* 修正邊框重疊問題 */
        }

        /* --- V13 新增：右側凍結 (最佳成績) --- */
        .sticky-col-right {
            position: sticky;
            right: 0;
            z-index: 30;
            border-left: 3px solid #dee2e6 !important;
            border-right: none !important;
            min-width: 80px; max-width: 80px;
            font-weight: bold;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
            background-clip: padding-box;
        }

        /* 確保表頭背景色正確 */
        thead th.sticky-col-left, thead th.sticky-col-right {
            background-color: #212529; /* Bootstrap table-dark color */
            color: white;
            z-index: 40; /* 表頭層級最高 */
        }

        /* 選中特效 */
        .cell-selected { 
            border: 3px solid #0d6efd !important; 
            background-color: #e7f1ff !important;
            position: relative;
            z-index: 15; 
        }

        /* 控制台樣式 */
        .control-panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #fff; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            padding: 10px 10px 20px 10px; z-index: 1000;
            border-top: 1px solid #dee2e6;
            display: flex; flex-direction: column; gap: 8px;
        }
        .dashboard-row { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 5px; }
        .dash-card { flex: 1; background: #f8f9fa; border-radius: 8px; padding: 5px; text-align: center; border: 1px solid #e9ecef; }
        .dash-label { font-size: 0.75rem; color: #6c757d; font-weight: bold; display: block; margin-bottom: 2px; }
        .dash-val { font-size: 1.2rem; font-weight: 900; color: #212529; line-height: 1.2; }
        .dash-val-bib { color: #0d6efd; font-size: 1.4rem; } 
        
        .btn-set-start { width: 100%; background-color: #e7f1ff; color: #0d6efd; border: 1px dashed #0d6efd; border-radius: 6px; padding: 4px; font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .btn-set-start:disabled { background: #f8f9fa; border-color: #dee2e6; color: #adb5bd; }

        .control-btn-group { display: flex; gap: 6px; height: 55px; }
        .btn-ctrl { flex: 1; font-size: 1.4rem; font-weight: 900; border-radius: 10px; border: none; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: transform 0.1s; }
        .btn-ctrl:active { transform: translateY(4px); box-shadow: none; }
        .btn-undo { flex: 0.6; background-color: #6c757d; color: white; font-size: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }

        .dns-card { position: relative; cursor: pointer; }
        .dns-checkbox:checked + label { color: #dc3545; font-weight: 900; }
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
        .keypad-btn { height: 55px; font-size: 1.5rem; font-weight: 600; border-radius: 8px; border: 1px solid #dee2e6; background: white; }
        .input-screen { font-size: 2rem; font-weight: bold; text-align: center; background: #fff; border: 2px solid #0d6efd; border-radius: 10px; height: 60px; line-height: 55px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container-fluid p-0 p-sm-3">
    
    <div id="setupPanel" class="card p-3 shadow-sm mx-auto mt-3" style="max-width: 600px;">
        <h4 class="text-center fw-bold mb-3">🏆 跳高裁判系統 V13</h4>
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
            <span class="fs-5 fw-bold">選手人數</span>
            <div class="input-group" style="width: 140px;">
                <button class="btn btn-outline-secondary fw-bold" onclick="adjCount(-1)">－</button>
                <input type="number" id="athleteCount" class="form-control text-center fw-bold fs-5" value="10" readonly>
                <button class="btn btn-outline-secondary fw-bold" onclick="adjCount(1)">＋</button>
            </div>
        </div>
        <div class="mb-2 text-center text-muted small">輸入高度 (例: 145)</div>
        <div class="input-screen" id="inputDisplay"><span class="text-muted fs-4 fw-normal">等待輸入...</span></div>
        <div class="d-flex flex-wrap gap-2 justify-content-center mb-3 p-2 bg-light rounded" id="heightPreview" style="min-height:50px;">
            <span class="text-muted small align-self-center">尚未設定高度</span>
        </div>
        <div class="keypad-grid">
            <button class="btn keypad-btn" onclick="pressKey('1')">1</button>
            <button class="btn keypad-btn" onclick="pressKey('2')">2</button>
            <button class="btn keypad-btn" onclick="pressKey('3')">3</button>
            <button class="btn keypad-btn" onclick="pressKey('4')">4</button>
            <button class="btn keypad-btn" onclick="pressKey('5')">5</button>
            <button class="btn keypad-btn" onclick="pressKey('6')">6</button>
            <button class="btn keypad-btn" onclick="pressKey('7')">7</button>
            <button class="btn keypad-btn" onclick="pressKey('8')">8</button>
            <button class="btn keypad-btn" onclick="pressKey('9')">9</button>
            <button class="btn keypad-btn" style="visibility:hidden"> </button>
            <button class="btn keypad-btn" onclick="pressKey('0')">0</button>
            <button class="btn btn-danger keypad-btn text-white" onclick="pressKey('back')">⌫</button>
        </div>
        <button class="btn btn-primary btn-lg w-100 fw-bold py-3 mt-4" onclick="goToStep2()">下一步</button>
    </div>

    <div id="dnsPanel" class="card p-3 shadow-sm d-none mx-auto mt-3" style="max-width: 800px;">
        <div class="alert alert-warning text-center fw-bold">點擊勾選未出賽 (DNS) 選手</div>
        <div id="dnsList" class="row g-2 mb-4"></div>
        <div class="d-flex justify-content-between">
            <button class="btn btn-secondary btn-lg" onclick="backToSetup()">返回</button>
            <button class="btn btn-success btn-lg" onclick="startCompetition()">開始比賽 🏁</button>
        </div>
    </div>

    <div id="mainPanel" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-2 px-2 pt-2">
            <button class="btn btn-warning btn-sm fw-bold" onclick="openAddHeightModal()">+ 高度</button>
            <div class="fs-6 fw-bold">場上: <span id="activeCount" class="text-success">0</span> 人</div>
            <button class="btn btn-info btn-sm text-white fw-bold" onclick="showRanking()">排名 📊</button>
        </div>

        <div class="table-container">
            <table class="table mb-0" id="scoreTable">
                <thead class="table-dark">
                    </thead>
                <tbody id="scoreBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="controlPanel" class="control-panel d-none">
    <div class="dashboard-row">
        <div class="dash-card">
            <span class="dash-label">目前高度</span>
            <span class="dash-val" id="dashHeight">--</span>
        </div>
        <div class="dash-card" style="background: #e7f1ff; border-color: #b6d4fe;">
            <span class="dash-label">選手背號</span>
            <span class="dash-val dash-val-bib" id="dashBib">--</span>
        </div>
        <div class="dash-card">
            <span class="dash-label">第幾跳</span>
            <span class="dash-val" id="dashAttempt">--</span>
        </div>
    </div>
    <button id="btnSetStart" class="btn-set-start" onclick="openStartHeightModalFromControl()" disabled>
        📍 設定此為起跳高度
    </button>
    <div class="control-btn-group">
        <button class="btn btn-success btn-ctrl" onclick="submitResult('O')">O</button>
        <button class="btn btn-danger btn-ctrl" onclick="submitResult('X')">X</button>
        <button class="btn btn-warning btn-ctrl" onclick="submitResult('-')">-</button>
        <button class="btn btn-undo btn-ctrl" onclick="undoResult()">⎌<br><small>倒退</small></button>
    </div>
</div>

<div class="modal fade" id="startHeightModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">設定起跳高度</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-center fw-bold mb-2">選手 #<span id="modalBib"></span> 從哪裡開始跳？</p>
                <div id="startHeightList" class="d-grid gap-2" style="max-height: 350px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="rankingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">📊 目前排名</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-secondary"><tr><th>名次</th><th>背號</th><th>最佳</th><th>狀態</th></tr></thead>
                    <tbody id="rankingBody"></tbody>
                </table>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">關閉</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- 音效系統 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
    function playSound(action) {
        switch(action) {
            case 'O': playTone(880, 'sine', 0.15); break;
            case 'X': playTone(150, 'sawtooth', 0.3); break;
            case '-': playTone(440, 'triangle', 0.1); break;
            case 'undo': playTone(600, 'square', 0.1); setTimeout(()=>playTone(300, 'square', 0.1), 80); break;
        }
    }

    let athletes = [];
    let heightList = [];
    let inputBuffer = "";
    let selectedAthleteId = null;
    let selectedHeight = null;
    let startHeightModalObj = null;
    let rankingModalObj = null;

    // --- 輸入邏輯 ---
    function adjCount(n) {
        let el = document.getElementById('athleteCount');
        let val = parseInt(el.value) + n;
        if(val < 1) val = 1;
        el.value = val;
    }
    function pressKey(key) {
        let displayEl = document.getElementById('inputDisplay');
        if (key === 'back') {
            if (inputBuffer.length > 0) inputBuffer = inputBuffer.slice(0, -1);
            else if (heightList.length > 0) { heightList.pop(); renderHeightPreview(); }
        } else {
            if (inputBuffer.length < 3) inputBuffer += key;
        }
        if (inputBuffer.length === 0) displayEl.innerHTML = '<span class="text-muted fs-4 fw-normal">等待輸入...</span>';
        else if (inputBuffer.length === 3) {
            let val = inputBuffer[0] + "." + inputBuffer.substring(1);
            heightList.push(val);
            inputBuffer = "";
            displayEl.innerHTML = '<span class="text-muted fs-4 fw-normal">等待輸入...</span>';
            renderHeightPreview();
        } else {
            displayEl.innerText = inputBuffer.length === 2 ? inputBuffer[0]+"."+inputBuffer[1] : inputBuffer;
        }
    }
    function renderHeightPreview() {
        let box = document.getElementById('heightPreview');
        box.innerHTML = heightList.length ? heightList.map(h => `<span class="badge bg-secondary fs-6">${h}</span>`).join(' ') : '<span class="text-muted small align-self-center">尚未設定高度</span>';
    }

    // --- 初始化流程 ---
    function goToStep2() {
        if (!heightList.length) return alert("請至少輸入一個高度！");
        heightList.sort((a,b)=>parseFloat(a)-parseFloat(b));
        heightList = [...new Set(heightList)];
        let html = '';
        let count = parseInt(document.getElementById('athleteCount').value);
        for(let i=1; i<=count; i++) {
            html += `<div class="col-3 col-md-2"><div class="dns-card form-check p-2 border rounded bg-white text-center" onclick="toggleDNS(${i})">
                <input class="form-check-input dns-checkbox" type="checkbox" value="${i}" id="dns_${i}">
                <label class="d-block fw-bold mt-1" for="dns_${i}">#${i}</label>
            </div></div>`;
        }
        document.getElementById('dnsList').innerHTML = html;
        document.getElementById('setupPanel').classList.add('d-none');
        document.getElementById('dnsPanel').classList.remove('d-none');
    }
    function toggleDNS(id) {
        let cb = document.getElementById('dns_'+id);
        if(event.target !== cb) cb.checked = !cb.checked;
    }
    function backToSetup() {
        document.getElementById('dnsPanel').classList.add('d-none');
        document.getElementById('setupPanel').classList.remove('d-none');
    }
    function startCompetition() {
        let count = parseInt(document.getElementById('athleteCount').value);
        let dnsSet = new Set(Array.from(document.querySelectorAll('.dns-checkbox:checked')).map(cb=>parseInt(cb.value)));
        
        athletes = [];
        for(let i=1; i<=count; i++) {
            athletes.push({
                id: i, bib: i,
                status: dnsSet.has(i) ? 'DNS' : 'ACTIVE',
                results: {}, bestHeight: 0, bestHeightStr: "NM",
                consecutiveFails: 0, totalFails: 0
            });
        }
        
        document.getElementById('dnsPanel').classList.add('d-none');
        document.getElementById('mainPanel').classList.remove('d-none');
        document.getElementById('controlPanel').classList.remove('d-none');
        startHeightModalObj = new bootstrap.Modal(document.getElementById('startHeightModal'));
        rankingModalObj = new bootstrap.Modal(document.getElementById('rankingModal'));

        renderTableStructure();
        renderTableRows();
        updateActiveCount();
        if(heightList.length > 0) autoSelectNext(heightList[0], -1);
    }

    // --- 核心渲染 ---
    function renderTableStructure() {
        let thead = document.querySelector('#scoreTable thead');
        thead.innerHTML = '';
        let tr = document.createElement('tr');
        
        // 1. 左側凍結：背號
        let thBib = document.createElement('th');
        thBib.className = 'sticky-col-left';
        thBib.innerText = 'No.';
        tr.appendChild(thBib);
        
        // 2. 中間：高度
        heightList.forEach(h => {
            let th = document.createElement('th');
            th.textContent = h;
            tr.appendChild(th);
        });

        // 3. 右側凍結：最佳成績 (V13 更新)
        let thBest = document.createElement('th');
        thBest.className = 'sticky-col-right';
        thBest.innerText = '最佳';
        tr.appendChild(thBest);
        
        thead.appendChild(tr);
    }

    function renderTableRows() {
        let tbody = document.getElementById('scoreBody');
        tbody.innerHTML = '';
        
        athletes.forEach(a => {
            let tr = document.createElement('tr');
            let rowColor = 'white'; // 預設背景

            if(a.status === 'DNS') rowColor = '#f0f0f0';
            else if(a.status !== 'ACTIVE') rowColor = '#ffe6e6';
            
            tr.style.backgroundColor = rowColor;

            // 1. 左側凍結：背號
            let bibHtml = a.status==='DNS' ? `${a.bib}<br><small>DNS</small>` : `#${a.bib}`;
            let tdBib = document.createElement('td');
            tdBib.className = 'sticky-col-left text-primary fs-5';
            tdBib.style.backgroundColor = rowColor; // 必須手動設定背景色以遮擋捲動內容
            tdBib.innerHTML = bibHtml;
            tr.appendChild(tdBib);

            // 2. 中間：成績格
            heightList.forEach(h => {
                let td = document.createElement('td');
                td.id = `cell_${a.id}_${h.replace('.','_')}`;
                td.onclick = () => selectCell(a.id, h);

                let attempts = a.results[h] || [];
                let html = '';
                attempts.forEach(res => {
                    let cls = res==='O'?'status-O':res==='X'?'status-X':res==='-'?'status-P':'status-R';
                    html += `<span class="status-box ${cls}">${res}</span>`;
                });
                td.innerHTML = html;
                if(selectedAthleteId === a.id && selectedHeight === h) td.classList.add('cell-selected');
                tr.appendChild(td);
            });

            // 3. 右側凍結：最佳成績 (V13 更新)
            let displayBest = "";
            let colorClass = "";
            
            if (a.status === 'DNS') {
                displayBest = "DNS";
                colorClass = "text-secondary";
            } else if (a.bestHeightStr === "NM") {
                displayBest = "NM";
                colorClass = "text-danger";
            } else {
                displayBest = a.bestHeightStr;
                colorClass = "text-dark";
            }

            let tdBest = document.createElement('td');
            tdBest.className = `sticky-col-right fw-bold ${colorClass}`;
            tdBest.style.backgroundColor = rowColor; // 必須手動設定背景色
            tdBest.innerText = displayBest;
            tr.appendChild(tdBest);

            tbody.appendChild(tr);
        });
        
        updateControlPanel();
        scrollToSelection();
    }

    function scrollToSelection() {
        setTimeout(() => {
            let el = document.querySelector('.cell-selected');
            if(el) el.scrollIntoView({behavior: "smooth", block: "nearest", inline: "center"});
        }, 50);
    }

    function selectCell(aid, height) {
        selectedAthleteId = aid;
        selectedHeight = height;
        renderTableRows();
    }

    // --- 邏輯功能 ---
    function updateControlPanel() {
        let dashHeight = document.getElementById('dashHeight');
        let dashBib = document.getElementById('dashBib');
        let dashAttempt = document.getElementById('dashAttempt');
        let setStartBtn = document.getElementById('btnSetStart');
        let btns = document.querySelectorAll('.btn-ctrl');
        
        if (selectedAthleteId === null) {
            dashHeight.innerText = "--"; dashBib.innerText = "--"; dashAttempt.innerText = "--";
            setStartBtn.disabled = true; btns.forEach(b => b.disabled = true);
            return;
        }

        let athlete = athletes.find(a => a.id === selectedAthleteId);
        let attempts = athlete.results[selectedHeight] || [];
        
        dashHeight.innerText = selectedHeight;
        dashBib.innerText = `#${athlete.bib}`;
        let isClosed = attempts.includes('O') || attempts.includes('r') || (attempts.length>0 && attempts[attempts.length-1]==='-') || attempts.length >= 3;
        
        if (isClosed) {
            dashAttempt.innerText = "完"; dashAttempt.style.color = "#28a745";
        } else {
            dashAttempt.innerText = `第 ${attempts.length + 1} 跳`; dashAttempt.style.color = "#dc3545";
        }
        
        setStartBtn.disabled = (athlete.status === 'DNS');
        if (athlete.status === 'DNS') btns.forEach(b => b.disabled = true);
        else btns.forEach(b => {
             if(b.innerText.includes('倒退')) b.disabled = (attempts.length === 0);
             else b.disabled = isClosed || athlete.status !== 'ACTIVE';
        });
    }

    function undoResult() {
        if (!selectedAthleteId || !selectedHeight) return;
        let a = athletes.find(x => x.id === selectedAthleteId);
        let r = a.results[selectedHeight];
        if(r && r.length > 0) {
            playSound('undo'); r.pop(); recalcAthleteStats(a); renderTableRows(); updateActiveCount();
        }
    }

    function submitResult(res) {
        if (!selectedAthleteId || !selectedHeight) return;
        let a = athletes.find(x => x.id === selectedAthleteId);
        if(!a.results[selectedHeight]) a.results[selectedHeight] = [];
        
        playSound(res);
        a.results[selectedHeight].push(res);
        
        if(res === 'O') {
            a.consecutiveFails = 0; a.bestHeightStr = selectedHeight; a.bestHeight = parseFloat(selectedHeight);
        } else if (res === 'X') {
            a.consecutiveFails++; a.totalFails++;
            if(a.consecutiveFails >= 3) {
                a.status = 'OUT'; setTimeout(()=>alert(`選手 #${a.bib} 淘汰！`), 100);
            }
        } else if (res === 'r') a.status = 'RETIRED';
        
        renderTableRows(); updateActiveCount(); autoSelectNext(selectedHeight, a.id);
    }

    function recalcAthleteStats(a) {
        a.bestHeight = 0; a.bestHeightStr = "NM"; a.consecutiveFails = 0; a.totalFails = 0;
        if(a.status === 'DNS') return;
        a.status = 'ACTIVE'; let isRetired = false;
        for(let h of heightList) {
            let res = a.results[h] || [];
            if(res.length === 0) continue;
            if(res.includes('r')) { isRetired = true; break; }
            res.forEach(r => {
                if(r === 'X') { a.consecutiveFails++; a.totalFails++; } 
                else if (r === 'O') { a.consecutiveFails = 0; a.bestHeightStr = h; a.bestHeight = parseFloat(h); }
            });
        }
        if(isRetired) a.status = 'RETIRED'; else if(a.consecutiveFails >= 3) a.status = 'OUT';
    }

    function autoSelectNext(height, currentId) {
        let startIndex = athletes.findIndex(a => a.id === currentId);
        let nextAthlete = null;
        for(let i = startIndex + 1; i < athletes.length; i++) if (isEligible(athletes[i], height)) { nextAthlete = athletes[i]; break; }
        if (!nextAthlete) for(let i = 0; i <= startIndex; i++) if (isEligible(athletes[i], height)) { nextAthlete = athletes[i]; break; }
        
        if (nextAthlete) selectCell(nextAthlete.id, height);
        else {
            let currentHIndex = heightList.indexOf(height);
            if (currentHIndex >= 0 && currentHIndex < heightList.length - 1) {
                let nextHeight = heightList[currentHIndex + 1];
                let firstInNext = athletes.find(a => isEligible(a, nextHeight));
                if (firstInNext) selectCell(firstInNext.id, nextHeight); else { selectedAthleteId = null; renderTableRows(); }
            } else { selectedAthleteId = null; renderTableRows(); }
        }
    }

    function isEligible(a, h) {
        if (a.status !== 'ACTIVE') return false;
        let r = a.results[h] || [];
        return !(r.includes('O') || r.includes('r') || (r.length>0 && r[r.length-1]==='-') || r.length >= 3);
    }

    function openStartHeightModalFromControl() {
        if (!selectedAthleteId) return;
        let a = athletes.find(x => x.id === selectedAthleteId);
        document.getElementById('modalBib').innerText = a.bib;
        let listDiv = document.getElementById('startHeightList');
        listDiv.innerHTML = '';
        heightList.forEach(h => {
            let btn = document.createElement('button');
            btn.className = 'btn btn-outline-primary fw-bold py-2 text-start';
            btn.innerHTML = `從 ${h} 開始跳`;
            btn.onclick = () => confirmStartHeight(h);
            listDiv.appendChild(btn);
        });
        startHeightModalObj.show();
    }
    function confirmStartHeight(targetH) {
        let a = athletes.find(x => x.id === selectedAthleteId);
        let targetVal = parseFloat(targetH);
        heightList.forEach(h => {
            if (parseFloat(h) < targetVal) a.results[h] = ['-'];
            else { let r = a.results[h] || []; if (r.length === 1 && r[0] === '-') a.results[h] = []; }
        });
        recalcAthleteStats(a); startHeightModalObj.hide(); renderTableRows();
        if(selectedHeight) autoSelectNext(selectedHeight, selectedAthleteId || -1);
    }

    function showRanking() {
        let list = athletes.filter(a => a.status !== 'DNS');
        list.sort((a, b) => {
            let hA = a.bestHeight || 0, hB = b.bestHeight || 0;
            if (hB !== hA) return hB - hA;
            if (hA > 0) {
                let failsA = (a.results[a.bestHeightStr]||[]).filter(r=>r==='X').length;
                let failsB = (b.results[b.bestHeightStr]||[]).filter(r=>r==='X').length;
                if (failsA !== failsB) return failsA - failsB;
            }
            return a.totalFails - b.totalFails;
        });
        let tbody = document.getElementById('rankingBody'); tbody.innerHTML = '';
        let currentDisplayRank = 1;
        list.forEach((a, i) => {
            let displayRank = currentDisplayRank;
            if (i > 0) {
                let prev = list[i-1];
                let isTied = false;
                let hA = a.bestHeight || 0, hB = prev.bestHeight || 0;
                if (hA === hB) {
                    if (hA === 0) isTied = true;
                    else {
                        let failsA = (a.results[a.bestHeightStr]||[]).filter(r=>r==='X').length;
                        let failsB = (prev.results[prev.bestHeightStr]||[]).filter(r=>r==='X').length;
                        if (failsA === failsB && a.totalFails === prev.totalFails) isTied = true;
                    }
                }
                if (isTied) displayRank = tbody.lastChild.firstChild.innerText;
                else { displayRank = i + 1; currentDisplayRank = i + 1; }
            } else { displayRank = 1; currentDisplayRank = 1; }
            
            let note = a.bestHeightStr === "NM" ? '<span class="text-danger small">NM</span>' : ''; 
            if(a.status === 'OUT' && a.bestHeightStr !== "NM") note = '<small class="text-danger">(OUT)</small>';
            
            tbody.innerHTML += `<tr><td class="fw-bold fs-5">${displayRank}</td><td class="fw-bold">#${a.bib}</td><td>${a.bestHeightStr}</td><td>${note}</td></tr>`;
        });
        rankingModalObj.show();
    }

    function openAddHeightModal() {
        let valStr = prompt("新增高度 (如 205 = 2.05):");
        if(valStr) {
            if(!valStr.includes('.') && valStr.length===3) valStr = valStr[0]+"."+valStr.substring(1);
            let val = parseFloat(valStr).toFixed(2);
            if(!isNaN(val) && !heightList.includes(val)) {
                heightList.push(val); heightList.sort((a,b)=>parseFloat(a)-parseFloat(b)); renderTableStructure(); renderTableRows();
            }
        }
    }
    function updateActiveCount() { document.getElementById('activeCount').innerText = athletes.filter(a => a.status === 'ACTIVE').length; }
</script>
</body>
